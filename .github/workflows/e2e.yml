# The Playwright suite (axe a11y gate over every route × theme × viewport,
# keyboard navigation, interaction specs) is NOT part of the Pages deploy
# pipeline — this separate workflow runs it on every push to main so an a11y
# or interaction regression shows up as a red run instead of slipping through
# locally-untested merges. See e2e/AGENTS.md.
name: E2E (Playwright)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # Version comes from package.json "packageManager" — the lockfile is
        # maintained by pnpm 12; older majors fail the frozen-lockfile check.
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright suite
        run: pnpm exec playwright test
